<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XAgent — Advanced AI Assistant</title>
<meta name="description" content="XAgent — an advanced AI agent. Chat, code, calculate, convert and get business advice. Multiple expert modes, built-in tools, full chat history." />
<style>
  :root{
    --bg:#0b0f17; --panel:#111827; --panel2:#0f172a; --border:#1f2937;
    --text:#e5e7eb; --muted:#9ca3af; --accent:#6366f1; --accent2:#22d3ee;
    --user:#1e293b; --danger:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; display:flex; overflow:hidden}
  /* ---------- Sidebar ---------- */
  #sidebar{width:280px; min-width:280px; background:var(--panel2); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:margin .25s}
  #sidebar.hidden{margin-left:-280px}
  .brand{padding:18px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border)}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff}
  .brand h1{font-size:19px; letter-spacing:.3px}
  .brand small{display:block; color:var(--muted); font-size:11px; font-weight:400}
  #newChat{margin:14px; padding:11px; border:1px dashed var(--accent); background:rgba(99,102,241,.08); color:var(--text); border-radius:10px; cursor:pointer; font-size:14px; font-weight:600}
  #newChat:hover{background:rgba(99,102,241,.18)}
  #chatList{flex:1; overflow-y:auto; padding:0 8px}
  .chatItem{display:flex; align-items:center; gap:8px; padding:10px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:13.5px}
  .chatItem:hover{background:var(--panel)}
  .chatItem.active{background:var(--panel); color:var(--text)}
  .chatItem .t{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chatItem .del{opacity:0; border:none; background:none; color:var(--danger); cursor:pointer; font-size:15px; padding:2px 4px}
  .chatItem:hover .del{opacity:1}
  .sideFoot{padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px}
  .sideFoot button{flex:1; padding:8px; background:var(--panel); color:var(--muted); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:12.5px}
  .sideFoot button:hover{color:var(--text)}
  /* ---------- Main ---------- */
  #main{flex:1; display:flex; flex-direction:column; min-width:0}
  header{display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); background:var(--panel2)}
  #menuBtn{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 11px; cursor:pointer; font-size:15px}
  header .title{font-weight:700; font-size:16px}
  #modeSel{margin-left:auto; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13.5px; cursor:pointer}
  #status{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
  #dot{width:9px; height:9px; border-radius:50%; background:#f59e0b}
  #dot.on{background:var(--ok)} #dot.off{background:var(--danger)}
  /* ---------- Messages ---------- */
  #messages{flex:1; overflow-y:auto; padding:26px 18px; display:flex; flex-direction:column; gap:18px}
  .wrap{max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  .msg{display:flex; gap:12px; animation:fade .25s ease}
  @keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1}}
  .avatar{width:34px; height:34px; min-width:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700}
  .avatar.ai{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff}
  .avatar.me{background:var(--user); color:var(--accent2); border:1px solid var(--border)}
  .bubble{flex:1; min-width:0; line-height:1.65; font-size:15px; padding-top:5px; word-wrap:break-word}
  .bubble p{margin:0 0 10px} .bubble p:last-child{margin-bottom:0}
  .bubble h1,.bubble h2,.bubble h3{margin:14px 0 8px; line-height:1.3}
  .bubble h1{font-size:21px}.bubble h2{font-size:18px}.bubble h3{font-size:16px}
  .bubble ul,.bubble ol{margin:6px 0 12px 22px}
  .bubble li{margin:3px 0}
  .bubble a{color:var(--accent2)}
  .bubble code{background:#1e293b; padding:2px 6px; border-radius:5px; font-size:13.5px; font-family:Consolas,monospace}
  .codeblock{position:relative; background:#020617; border:1px solid var(--border); border-radius:10px; margin:10px 0; overflow:hidden}
  .codeblock pre{padding:14px; overflow-x:auto; font-size:13.5px; line-height:1.55}
  .codeblock pre code{background:none; padding:0}
  .copyBtn{position:absolute; top:8px; right:8px; background:var(--panel); color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:4px 9px; font-size:11.5px; cursor:pointer}
  .copyBtn:hover{color:var(--text)}
  .badges{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  .badge{font-size:11px; color:var(--accent2); border:1px solid var(--border); background:var(--panel); padding:2px 8px; border-radius:20px}
  .badge.tool{color:#fbbf24}
  .typing{display:inline-flex; gap:5px; padding:8px 2px}
  .typing span{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  /* ---------- Welcome ---------- */
  #welcome{text-align:center; padding:38px 10px 6px}
  #welcome .big{font-size:30px; font-weight:800; margin-bottom:8px}
  #welcome .big span{background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
  #welcome p{color:var(--muted); font-size:14.5px; max-width:560px; margin:0 auto 20px}
  .chips{display:flex; flex-wrap:wrap; gap:9px; justify-content:center; max-width:640px; margin:0 auto}
  .chip{background:var(--panel); border:1px solid var(--border); color:var(--text); padding:9px 14px; border-radius:20px; cursor:pointer; font-size:13.5px}
  .chip:hover{border-color:var(--accent)}
  /* ---------- Composer ---------- */
  #composer{border-top:1px solid var(--border); background:var(--panel2); padding:14px 18px}
  .cwrap{max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end}
  #input{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px; color:var(--text); padding:12px 14px; font-size:15px; resize:none; max-height:150px; font-family:inherit; outline:none}
  #input:focus{border-color:var(--accent)}
  #sendBtn{background:linear-gradient(135deg,var(--accent),#4f46e5); color:#fff; border:none; border-radius:12px; padding:12px 20px; font-size:15px; font-weight:700; cursor:pointer}
  #sendBtn:disabled{opacity:.5; cursor:default}
  #stopBtn{display:none; background:var(--danger); color:#fff; border:none; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:700; cursor:pointer}
  .hint{max-width:820px; margin:8px auto 0; color:var(--muted); font-size:11.5px; text-align:center}
  @media (max-width:720px){
    #sidebar{position:fixed; z-index:20; height:100%; box-shadow:0 0 40px rgba(0,0,0,.5)}
    #sidebar.hidden{margin-left:-290px}
    header .title{display:none}
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="logo">X</div>
    <h1>XAgent<small>Advanced AI Assistant</small></h1>
  </div>
  <button id="newChat">+ New Chat</button>
  <div id="chatList"></div>
  <div class="sideFoot">
    <button id="exportBtn">Export Chat</button>
    <button id="clearBtn">Clear All</button>
  </div>
</aside>

<div id="main">
  <header>
    <button id="menuBtn">☰</button>
    <div class="title">XAgent</div>
    <select id="modeSel" title="Agent mode">
      <option value="general">✦ General Assistant</option>
      <option value="coding">💻 Coding Expert</option>
      <option value="urdu">🇵🇰 Urdu Dost</option>
      <option value="business">📈 Business Advisor</option>
    </select>
    <div id="status"><span id="dot"></span><span id="statusTxt">Checking…</span></div>
  </header>

  <div id="messages"><div class="wrap" id="msgWrap"></div></div>

  <div id="composer">
    <div class="cwrap">
      <textarea id="input" rows="1" placeholder="Ask anything… try: Calculate (45+5)*3 — or — Convert 10 km to miles"></textarea>
      <button id="stopBtn">Stop</button>
      <button id="sendBtn">Send</button>
    </div>
    <div class="hint">XAgent can make mistakes — verify important information. Chats are saved only in your browser.</div>
  </div>
</div>

<script>
"use strict";
/* ================= State ================= */
const LS_KEY = "xagent_chats_v1";
let chats = [];
let activeId = null;
let busy = false;
let stopFlag = false;

try { chats = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { chats = []; }
if (!Array.isArray(chats)) chats = [];

const $ = (id) => document.getElementById(id);
const msgWrap = $("msgWrap"), inputEl = $("input"), sendBtn = $("sendBtn"),
      stopBtn = $("stopBtn"), chatListEl = $("chatList"), modeSel = $("modeSel");

function save() { localStorage.setItem(LS_KEY, JSON.stringify(chats)); }
function activeChat() { return chats.find(c => c.id === activeId) || null; }
function newChatObj() {
  return { id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
           title: "New chat", mode: modeSel.value, messages: [] };
}
function ensureChat() {
  if (!activeChat()) {
    const c = newChatObj();
    chats.unshift(c); activeId = c.id; save();
  }
  return activeChat();
}

/* ================= Markdown (minimal, safe) ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function inlineMd(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdToHtml(md){
  const parts = md.split(/```(\w*)\n?/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) { // code block content follows in next part
      const code = parts[++i] || "";
      const end = code.lastIndexOf("```");
      const clean = (end >= 0 ? code.slice(0, end) : code).replace(/\n$/, "");
      html += '<div class="codeblock"><button class="copyBtn">Copy</button><pre><code>' + esc(clean) + "</code></pre></div>";
    } else {
      const lines = parts[i].split("\n");
      let inList = false, listType = "ul";
      for (const raw of lines) {
        const line = raw.trimEnd();
        const h = line.match(/^(#{1,3})\s+(.*)/);
        const ul = line.match(/^\s*[-•]\s+(.*)/);
        const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
        if (h) { if (inList){ html += "</"+listType+">"; inList=false; }
          html += "<h" + h[1].length + ">" + inlineMd(h[2]) + "</h" + h[1].length + ">"; }
        else if (ul || ol) {
          const t = ul ? "ul" : "ol";
          if (!inList || listType !== t) { if (inList) html += "</"+listType+">"; html += "<"+t+">"; inList = true; listType = t; }
          html += "<li>" + inlineMd((ul || ol)[1]) + "</li>";
        }
        else { if (inList){ html += "</"+listType+">"; inList=false; }
          if (line.trim()) html += "<p>" + inlineMd(line) + "</p>"; }
      }
      if (inList) html += "</"+listType+">";
    }
  }
  return html;
}

/* ================= Rendering ================= */
function renderChatList(){
  chatListEl.innerHTML = "";
  for (const c of chats) {
    const d = document.createElement("div");
    d.className = "chatItem" + (c.id === activeId ? " active" : "");
    d.innerHTML = '<span class="t"></span><button class="del" title="Delete">✕</button>';
    d.querySelector(".t").textContent = c.title || "New chat";
    d.onclick = () => { activeId = c.id; modeSel.value = c.mode || "general"; renderAll(); };
    d.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      if (activeId === c.id) activeId = chats[0]?.id || null;
      save(); renderAll();
    };
    chatListEl.appendChild(d);
  }
}
function badgesHtml(m){
  let b = "";
  if (m.tools && m.tools.length) b += m.tools.map(t => '<span class="badge tool">🛠 ' + esc(t) + "</span>").join("");
  if (m.provider) b += '<span class="badge">AI: ' + esc(m.provider) + "</span>";
  return b ? '<div class="badges">' + b + "</div>" : "";
}
function renderMessages(){
  const c = activeChat();
  msgWrap.innerHTML = "";
  if (!c || c.messages.length === 0) {
    msgWrap.innerHTML =
      '<div id="welcome"><div class="big">Meet <span>XAgent</span></div>' +
      "<p>An advanced AI agent with expert modes and built-in tools — calculator, unit converter and live date/time. Ask anything to begin.</p>" +
      '<div class="chips">' +
      ["What can you do?", "Calculate (45 + 5) * 3 + sqrt(144)", "Convert 10 km to miles",
       "What is the date and time in Pakistan?", "Write a Python function to check prime numbers",
       "Give me a business idea for Pakistan"].map(q =>
       '<button class="chip">' + esc(q) + "</button>").join("") +
      "</div></div>";
    msgWrap.querySelectorAll(".chip").forEach(ch => ch.onclick = () => { inputEl.value = ch.textContent; send(); });
    return;
  }
  for (const m of c.messages) {
    const row = document.createElement("div");
    row.className = "msg";
    row.innerHTML = '<div class="avatar ' + (m.role === "user" ? "me" : "ai") + '">' +
      (m.role === "user" ? "You" : "X") + '</div><div class="bubble"></div>';
    const bub = row.querySelector(".bubble");
    bub.innerHTML = (m.role === "assistant" ? mdToHtml(m.content) : "<p>" + esc(m.content) + "</p>") +
      (m.role === "assistant" ? badgesHtml(m) : "");
    msgWrap.appendChild(row);
  }
  wireCopyButtons();
  scrollDown();
}
function wireCopyButtons(){
  msgWrap.querySelectorAll(".copyBtn").forEach(b => {
    b.onclick = () => {
      const code = b.parentElement.querySelector("code").innerText;
      navigator.clipboard?.writeText(code);
      b.textContent = "Copied ✓"; setTimeout(() => b.textContent = "Copy", 1200);
    };
  });
}
function scrollDown(){ const m = $("messages"); m.scrollTop = m.scrollHeight; }
function renderAll(){ renderChatList(); renderMessages(); }

/* ================= Health status ================= */
async function checkHealth(){
  try {
    const r = await fetch("/api/health");
    const j = await r.json();
    if (j.status === "ok") { $("dot").className = "on"; $("dot").id = "dot";
      $("dot").style.background = "var(--ok)"; $("statusTxt").textContent = "AI Online (" + j.provider + ")"; return; }
    throw new Error("bad");
  } catch {
    $("dot").style.background = "var(--danger)";
    $("statusTxt").textContent = "API offline — direct mode";
  }
}

/* ================= Chat engine ================= */
async function fetchReply(messages, mode){
  // 1) Own backend (tools + provider chain)
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, mode })
    });
    const j = await r.json();
    if (r.ok && j.reply) return j;
    throw new Error(j.error || "backend error");
  } catch (e) {
    // 2) Direct fallback (no backend needed)
    const prompt = messages.map(m => (m.role === "user" ? "User: " : "Assistant: ") + m.content).join("\n") + "\nAssistant:";
    const r = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt));
    if (!r.ok) throw new Error("AI unavailable");
    const text = await r.text();
    return { reply: text, provider: "direct", tools: [] };
  }
}
function typewriter(el, full, done){
  let i = 0; stopFlag = false;
  const step = Math.max(1, Math.round(full.length / 220));
  (function tick(){
    if (stopFlag) { el.innerHTML = mdToHtml(full); wireCopyButtons(); done(); return; }
    i = Math.min(full.length, i + step);
    el.innerHTML = mdToHtml(full.slice(0, i));
    scrollDown();
    if (i < full.length) setTimeout(tick, 12);
    else { wireCopyButtons(); done(); }
  })();
}
async function send(){
  const text = inputEl.value.trim();
  if (!text || busy) return;
  const c = ensureChat();
  c.mode = modeSel.value;
  c.messages.push({ role: "user", content: text });
  if (c.messages.length === 1) c.title = text.slice(0, 42);
  inputEl.value = ""; inputEl.style.height = "auto";
  save(); renderAll();
  busy = true; sendBtn.disabled = true; stopBtn.style.display = "block";

  const row = document.createElement("div");
  row.className = "msg";
  row.innerHTML = '<div class="avatar ai">X</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  msgWrap.appendChild(row); scrollDown();
  const bub = row.querySelector(".bubble");

  try {
    const history = c.messages.map(m => ({ role: m.role, content: m.content }));
    const res = await fetchReply(history, c.mode);
    const msg = { role: "assistant", content: res.reply, provider: res.provider, tools: res.tools || [] };
    c.messages.push(msg); save(); renderChatList();
    typewriter(bub, res.reply, () => {
      bub.innerHTML = mdToHtml(res.reply) + badgesHtml(msg); wireCopyButtons(); finish();
    });
  } catch (e) {
    bub.innerHTML = "<p>⚠️ Sorry — the AI could not be reached. Please try again in a moment.</p>";
    finish();
  }
  function finish(){ busy = false; sendBtn.disabled = false; stopBtn.style.display = "none"; scrollDown(); }
}

/* ================= Events ================= */
sendBtn.onclick = send;
stopBtn.onclick = () => { stopFlag = true; };
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(150, inputEl.scrollHeight) + "px";
});
$("newChat").onclick = () => {
  const c = newChatObj(); chats.unshift(c); activeId = c.id; save(); renderAll(); inputEl.focus();
};
$("clearBtn").onclick = () => {
  if (!confirm("Delete ALL chats?")) return;
  chats = []; activeId = null; save(); renderAll();
};
$("exportBtn").onclick = () => {
  const c = activeChat(); if (!c) return;
  const text = c.messages.map(m => (m.role === "user" ? "You: " : "XAgent: ") + m.content).join("\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = "xagent-chat.txt"; a.click(); URL.revokeObjectURL(a.href);
};
$("menuBtn").onclick = () => $("sidebar").classList.toggle("hidden");
modeSel.onchange = () => { const c = activeChat(); if (c) { c.mode = modeSel.value; save(); } };

if (window.innerWidth < 720) $("sidebar").classList.add("hidden");
if (chats.length) { activeId = chats[0].id; modeSel.value = chats[0].mode || "general"; }
renderAll();
checkHealth();
</script>
</body>
</html>
